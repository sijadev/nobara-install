[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedora-autoinstall"
version = "1.0.0"
description = "Fedora unattended install configurator — ISO builder with package search"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.scripts]
fedora-autoinstall = "fedora_autoinstall.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["fedora_autoinstall*"]
